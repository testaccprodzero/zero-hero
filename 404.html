<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script id="zero404lang">/* served for any missing URL: works at a domain root and in a sub-folder (e.g. GitHub Pages /zero-hero/),
       shows the 404 in the visitor's language and points the root-absolute links at the site root */
    (function(){
      var parts=location.pathname.split('/'), root='/';
      if(/github\.io$/.test(location.hostname)&&parts[1]) root='/'+parts[1]+'/';
      var rest=location.pathname.slice(root.length), m=rest.match(/^(de|bs)\//);
      if(m&&document.documentElement.lang!==m[1]){location.replace(root+m[1]+'/404.html');return;}
      if(root==='/')return;
      document.addEventListener('DOMContentLoaded',function(){
        document.querySelectorAll('[href^="/"],[src^="/"]').forEach(function(el){
          ['href','src'].forEach(function(a){var v=el.getAttribute(a);if(v&&v.charAt(0)==='/'&&v.charAt(1)!=='/'&&v.indexOf(root)!==0)el.setAttribute(a,root+v.slice(1));});
        });
      });
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Offside! — Page Not Found · ZERO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800;1,900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --red: #e1141f; --red-glow: rgba(225,20,31,.55); --ink: #08080a; --skew: -14deg; --gutter: clamp(16px, 4.4vw, 76px); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; flex-direction: column; background: var(--ink); color: #fff; font-family: "Barlow", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }

    .nav { display: flex; justify-content: space-between; align-items: center; padding: 18px var(--gutter); }
    .nav img { height: 46px; display: block; }
    .nav a.back { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 16px; letter-spacing: .06em; color: rgba(255,255,255,.7); }
    .nav a.back:hover { color: #fff; }

    main { position: relative; isolation: isolate; flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: center; gap: clamp(24px, 4vw, 70px); padding: clamp(20px, 4vw, 60px) var(--gutter) clamp(50px, 6vw, 90px); overflow: hidden; }
    main::before { content: ""; position: absolute; z-index: -1; left: 30%; top: -30%; width: 22vw; height: 160%; background: linear-gradient(180deg, rgba(225,20,31,.6), transparent 80%); transform: skewX(-28deg); -webkit-mask: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); mask: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); }

    /* LED "404" (same as the homepage scoreboard) */
    .led { position: relative; display: inline-block; padding: 14px 22px 10px; background: radial-gradient(circle, rgba(255,255,255,.035) 0 1px, transparent 1.5px) 0 0 / 6px 6px, #050505; border: 6px solid #232328; box-shadow: 0 20px 50px rgba(0,0,0,.6), inset 0 0 30px #000; }
    .led__num { position: relative; display: block; font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: clamp(64px, 8vw, 120px); line-height: .9; filter: drop-shadow(0 0 6px rgba(255,40,50,.75)) drop-shadow(0 0 20px rgba(225,20,31,.45)); }
    .led__num span { display: block; color: #ff2a35; -webkit-mask: radial-gradient(circle, #000 52%, transparent 58%) 0 0 / 5px 5px; mask: radial-gradient(circle, #000 52%, transparent 58%) 0 0 / 5px 5px; animation: flick 3s steps(1) infinite; }
    @keyframes flick { 0%, 92%, 96%, 100% { opacity: 1; } 94% { opacity: .35; } }
    .led__var { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 14px; letter-spacing: .2em; color: #ffb23f; text-shadow: 0 0 8px rgba(255,178,63,.6); }
    .led__var i { width: 8px; height: 8px; border-radius: 50%; background: #ffb23f; box-shadow: 0 0 8px #ffb23f; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    h1 { margin-top: 28px; font-family: "Barlow Condensed", sans-serif; font-style: italic; font-weight: 900; font-size: clamp(80px, 12vw, 210px); line-height: .82; text-transform: uppercase; letter-spacing: -.01em; }
    h1 .bang { color: var(--red); display: inline-block; animation: whistle 2.6s ease-in-out infinite; transform-origin: bottom center; }
    @keyframes whistle { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(-10deg); } 82% { transform: rotate(8deg); } 88% { transform: rotate(-4deg); } }
    .lead { margin-top: 22px; max-width: 42ch; font-size: clamp(17px, 1.35vw, 21px); line-height: 1.55; color: rgba(255,255,255,.75); }
    .ctas { display: flex; flex-wrap: wrap; gap: 16px 24px; margin-top: 36px; padding-left: 8px; }
    .btn { position: relative; isolation: isolate; display: inline-flex; align-items: center; gap: 12px; height: 56px; padding: 0 34px; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 20px; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
    .btn::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(var(--skew)); transition: background .3s, border-color .3s; }
    .btn svg { width: 19px; height: 19px; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
    .btn:hover { transform: translateY(-2px); }
    .btn:hover svg { transform: translateX(5px); }
    .btn--primary::before { background: linear-gradient(180deg, #ec1a25, #c90f19); box-shadow: 0 10px 30px -8px var(--red-glow); }
    .btn--ghost::before { border: 1.5px solid rgba(255,255,255,.85); }
    .btn--ghost:hover::before { border-color: var(--red); background: rgba(255,255,255,.05); }
    .links { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 30px; font-size: 14.5px; color: rgba(255,255,255,.55); }
    .links a { text-decoration: underline; text-decoration-color: var(--red); text-underline-offset: 4px; color: rgba(255,255,255,.8); }
    .links a:hover { color: #fff; }

    /* pitch scene */
    .scene { position: relative; }
    .scene svg { width: 100%; height: auto; display: block; overflow: visible; }
    .scene * { vector-effect: non-scaling-stroke; }
    .o { fill: none; stroke: rgba(255,255,255,.88); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
    .d { fill: none; stroke: rgba(255,255,255,.35); stroke-width: 1.3; }
    .r { fill: none; stroke: var(--red); stroke-width: 2.4; stroke-linecap: round; filter: drop-shadow(0 0 6px var(--red-glow)); }
    .fill { fill: #0d0d10; }
    .label { font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 15px; letter-spacing: .16em; fill: #fff; }
    .label--r { fill: var(--red); }

    .offline { stroke-dasharray: 10 8; animation: march 1s linear infinite, drawIn 1.2s .6s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes march { to { stroke-dashoffset: -18; } }
    @keyframes drawIn { from { opacity: 0; transform: scaleY(0); } }
    .offline-g { transform-box: fill-box; transform-origin: bottom; }

    /* assistant referee: arm raises, then the flag waves */
    .arm { transform-box: fill-box; transform-origin: 6% 92%; animation: raise .9s 1.4s cubic-bezier(.3,1.4,.5,1) both; }
    @keyframes raise { from { transform: rotate(-150deg); } to { transform: rotate(0); } }
    .flag { transform-box: fill-box; transform-origin: 0 0; animation: wave .5s 2.3s ease-in-out infinite alternate; }
    @keyframes wave { from { transform: skewY(-6deg) scaleX(1); } to { transform: skewY(8deg) scaleX(.9); } }
    .attacker { animation: caught .7s 2s ease-out both; }
    @keyframes caught { 0% { opacity: 1; } 40% { opacity: .4; } 70% { opacity: 1; } 100% { opacity: 1; } }
    .ball { transform-box: fill-box; transform-origin: center; animation: roll 1.6s .2s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes roll { from { transform: translateX(-160px) rotate(-540deg); } }
    .tag-offside { opacity: 0; animation: pop .5s 2.4s cubic-bezier(.3,1.5,.5,1) forwards; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }

    @media (max-width: 900px) {
      main { grid-template-columns: minmax(0, 1fr); text-align: left; }
      .scene { order: -1; max-width: 560px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .tag-offside { opacity: 1; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/index.html" aria-label="ZERO home"><img src="/assets/zero-logo.png" alt="ZERO" /></a>
    <a class="back" href="/index.html">← Back to home</a>

  <main>
    <div>
      <div class="led" aria-hidden="true">
        <span class="led__num"><span>404</span></span>
        <span class="led__var"><i></i>VAR CHECK COMPLETE</span>
      </div>
      <h1>Offside<span class="bang">!</span></h1>
      <p class="lead">This page was past the last defender when the ball was played. The flag is up — but the game goes on.</p>
      <div class="ctas">
        <a class="btn btn--primary" href="/index.html">Back to the Pitch <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10h13M11 4.5 16.5 10 11 15.5"/></svg></a>
        <a class="btn btn--ghost" href="/index.html#contact">Get a Team Quote</a>
      </div>
      <p class="links">Or try: <a href="/products.html">Customisation options</a><a href="/size-guide.html">Size guide</a><a href="/about.html">About ZERO</a><a href="/index.html#faq">FAQ</a></p>
    </div>

    <div class="scene" aria-hidden="true">
      <svg viewBox="0 0 600 460">
        <!-- pitch in perspective -->
        <path d="M60 420 L540 420 L470 140 L130 140 Z" fill="rgba(255,255,255,.025)"/>
        <path class="d" d="M60 420 L540 420 L470 140 L130 140 Z"/>
        <path d="M95 280 L505 280" class="d"/>
        <path d="M112 210 L488 210" class="d" style="opacity:.6"/>
        <path d="M78 350 L522 350" class="d" style="opacity:.6"/>
        <ellipse class="d" cx="300" cy="420" rx="70" ry="16"/>
        <!-- offside line (red, perspective) -->
        <g class="offline-g"><path class="r offline" d="M366 140 L410 420"/></g>
        <text class="label label--r tag-offside" x="420" y="128">OFFSIDE</text>

        <!-- defender (white, on the line's left) -->
        <g transform="translate(300 246)">
          <circle class="o fill" cx="0" cy="-58" r="11"/>
          <path class="o fill" d="M-16 -44 L16 -44 L20 6 L-20 6 Z"/>
          <path class="o" d="M-16 -40 L-30 -8 M16 -40 L30 -10 M-10 6 L-16 52 M10 6 L18 50"/>
        </g>
        <!-- attacker (red outline, beyond the line) -->
        <g class="attacker" transform="translate(452 266)">
          <circle class="r fill" cx="0" cy="-58" r="11"/>
          <path class="r fill" d="M-16 -44 L16 -44 L20 6 L-20 6 Z"/>
          <path class="r" d="M-16 -40 L-34 -22 M16 -40 L32 -58 M-10 6 L-24 48 M10 6 L22 52"/>
          <text x="0" y="-14" text-anchor="middle" style="font:800 16px 'Barlow Condensed';fill:#e1141f">9</text>
        </g>
        <!-- ball -->
        <g class="ball"><circle class="o fill" cx="420" cy="320" r="9"/><path class="d" d="M414 316 l6 -3 6 3 -2 7 h-8 Z"/></g>

        <!-- assistant referee on the touchline -->
        <g transform="translate(118 330)">
          <circle class="o fill" cx="0" cy="-92" r="14"/>
          <path class="o fill" d="M-20 -74 L20 -74 L24 -10 L-24 -10 Z"/>
          <path class="o" d="M-20 -70 L-34 -30 M-12 -10 L-18 60 M12 -10 L18 60"/>
          <path class="d" d="M-18 60 L-30 62 M18 60 L30 62"/>
          <!-- raising arm with flag -->
          <g class="arm">
            <path class="o" d="M18 -70 L58 -128"/>
            <path class="o" d="M58 -128 L66 -176"/>
            <g class="flag">
              <path class="r fill" d="M66 -176 L112 -170 L106 -146 L64 -150 Z" style="fill:rgba(225,20,31,.35)"/>
              <path class="r" d="M74 -174 L72 -150 M84 -173 L82 -149 M94 -171 L92 -148 M66 -162 L109 -158"/>
            </g>
          </g>
          <text class="label" x="-30" y="94">ASSISTANT REF</text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
